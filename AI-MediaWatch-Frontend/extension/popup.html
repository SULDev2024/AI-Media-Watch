<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .header {
      background: linear-gradient(135deg, #1e40af, #7c3aed);
      padding: 16px;
      text-align: center;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .header p {
      font-size: 11px;
      opacity: 0.8;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.green { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .dot.red { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
    .dot.yellow { background: #eab308; box-shadow: 0 0 6px #eab308; }
    .status-text { font-size: 13px; }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 12px 16px;
    }
    .stat {
      background: #1e293b;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #60a5fa;
    }
    .stat-value.danger { color: #f87171; }
    .stat-label {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .section {
      padding: 12px 16px;
    }
    .section h2 {
      font-size: 12px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .check-input {
      display: flex;
      gap: 8px;
    }
    .check-input textarea {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      padding: 8px;
      font-size: 12px;
      resize: vertical;
      min-height: 60px;
      font-family: inherit;
    }
    .check-input textarea:focus {
      outline: none;
      border-color: #60a5fa;
    }
    .btn {
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
    }
    .btn:hover { background: #2563eb; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-full {
      width: 100%;
      margin-top: 8px;
    }
    .result {
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    .result.high {
      display: block;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }
    .result.low {
      display: block;
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid #22c55e;
      color: #86efac;
    }
    .result.medium {
      display: block;
      background: rgba(234, 179, 8, 0.2);
      border: 1px solid #eab308;
      color: #fde047;
    }
    .result.error {
      display: block;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid #64748b;
      color: #94a3b8;
    }
    .footer {
      padding: 8px 16px 12px;
      text-align: center;
      font-size: 10px;
      color: #64748b;
    }
    .footer a {
      color: #60a5fa;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>AI MediaWatch</h1>
    <p>Financial Scam Detection</p>
  </div>

  <div class="status" id="status">
    <div class="dot yellow" id="statusDot"></div>
    <span class="status-text" id="statusText">Checking connection...</span>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="scanned">0</div>
      <div class="stat-label">Scanned</div>
    </div>
    <div class="stat">
      <div class="stat-value danger" id="detected">0</div>
      <div class="stat-label">Scams Found</div>
    </div>
  </div>

  <div class="section">
    <h2>Quick Check</h2>
    <textarea id="checkText" placeholder="Paste suspicious text here to check instantly..."></textarea>
    <button class="btn btn-full" id="checkBtn">Analyze</button>
    <div class="result" id="result"></div>
  </div>

  <div class="footer">
    <a href="http://localhost:5173" target="_blank">Open Dashboard</a>
    &nbsp;&middot;&nbsp; Powered by Ollama + qwen2.5vl
  </div>

  <script src="popup.js"></script>
</body>
</html>
