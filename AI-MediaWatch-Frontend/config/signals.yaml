        - '\d{2,3}\s*%\s*(win\s*rate|winrate|profit|accuracy|success\s*rate)'
        - '(win\s*rate|accuracy)\s*[:\-]?\s*\d{2,3}\s*%'
        # Time-bound guaranteed payout — "get your profits within 72 hours",
        # "withdraw within 24hrs". A fixed-deadline payout promise is a strong
        # scam tell regardless of platform.
        - 'profits?\s+within\s+\d+\s*(hours?|hrs?|days?)'
        - '(withdraw|payout|cash\s*out)\s+within\s+\d+\s*(hours?|hrs?|days?)'
    requires: []
    regulation_ref: art_170_part2_kz

