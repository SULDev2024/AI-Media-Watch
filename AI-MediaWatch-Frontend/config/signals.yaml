# config/signals.yaml — Expert-curated indicator catalog (Phase 8)
#
# DISTINCT from TRIGGER_KEYWORDS in aimw.collection (§4 — priority filter, never evidence).
# Each entry becomes an EvidencePiece with polarity/strength/indicator_type/regulation_ref.
#
# Fields
# -------
# id              Machine identifier; becomes indicator_type on EvidencePiece.
# polarity        "incriminating" | "mitigating"
# default_strength "strong" | "medium" | "weak"
# match.keywords  Case-insensitive substrings checked against normalized text.
# match.regex     Patterns checked with re.IGNORECASE | re.UNICODE.
# requires        Entity field paths (e.g. "entities.crypto_wallets").  Each item
#                 is an OR — any one satisfied fires the signal once per package;
#                 source is set to "entity".  Empty list means keyword/regex only.
# regulation_ref  Statute id from regulations_kz.yaml; null where unsure.
#
# Keyword matching fires at most once per (indicator_type, source, segment/frame),
# so the same keyword appearing 5 times in one segment counts as one hit.
# Diminishing returns across multiple segments/frames is handled in rules.py.

indicators:

  # ── INCRIMINATING ──────────────────────────────────────────────────────────

  - id: guaranteed_return
    polarity: incriminating
    default_strength: medium
    match:
      keywords:
        - гарантир          # гарантирован*, гарантия
        - без риска
        - 100% прибыл
        - ежедневн выплат
        - пассивн доход
        - guaranteed return
        - guaranteed profit
        - no risk
        - risk free
        - riskfree
        - без потерь
        - всегда в плюс
      regex:
        - '\d+\s*%\s*(в\s+день|в\s+месяц|в\s+неделю|daily|monthly|weekly)'
    requires: []
    regulation_ref: art_170_part2_kz

