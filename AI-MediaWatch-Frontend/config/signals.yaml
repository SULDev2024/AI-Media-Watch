  # ── PHASE 15.9 SEMANTIC SIGNAL FAMILIES ──────────────────────────────────
  # Higher-level, multilingual (EN / RU / HI) families. Keyword sets are kept
  # DISJOINT from each other and from the legacy indicators above so a single
  # phrase fires exactly one indicator (no double-counting). See
  # signal_family_map.md for how legacy indicators roll up into these families.

  - id: investment_promise
    polarity: incriminating
    default_strength: medium
    match:
      keywords:
        # English — "turn small money into big money" investment promises
        - double your investment
        - grow your money fast
        - turn your money into
        - multiply your money
        - invest and earn daily
        - small investment big return
        - high return investment
        - high yield investment
        - make your money work
        # English — "investment plan" framing (was Hindi-only before)
        - investment plan
        - investment platform
        - invest with us
        - minimum investment
        - ultimate plan
        # Hindi (Devanagari / Hinglish)
        - इन्वेस्ट करके कमाओ        # invest and earn
        - इन्वेस्टमेंट प्लान         # investment plan
        - पैसा डबल                  # money double
        - विदाउट इन्वेस्टमेंट         # without investment (Hinglish)
        - बिना इन्वेस्टमेंट          # without investment
      regex:
        # turn $X into $Y  /  $X to $Y in N days
        - 'turn\s+\$?\d[\d,\.]*\s+(in)?to\s+\$?\d[\d,\.]*'
        - '\$?\d[\d,\.]*\s+into\s+\$?\d[\d,\.]*'
        # Phase 19B FN evidence — "flip $100 to $5000" / "$10 to $11,421"
        # Crypto Lord Gh & Micha Trader FN snippets used "to" rather than "into";
        # the existing patterns required "turn" or "into" and missed both.
        - 'flip\s+\$?\d[\d,\.]*\s+(in)?to\s+\$?\d[\d,\.]*'
        - '\$\d[\d,\.]*\s+to\s+\$\d[\d,\.]*'
    requires: []
    regulation_ref: art_170_part2_kz

  # The classic deposit/return table — "INVEST $200 GET $1,200",
  # "deposit 100 receive 1000", "send $50 get $500". A promised multiple
  # return on a fixed stake has no legitimate financial meaning, so this is
  # a STRONG standalone signal. (Telegram/Instagram investment-scam staple
  # that the "turn X into Y" patterns above did not catch.)
  - id: investment_multiplier
    polarity: incriminating
    default_strength: strong
    match:
      keywords: []
      regex:
        - '(invest|deposit|send|pay|stake)\s*\$?\d[\d,\.]*\s*(get|gets?|receive|make|earn|return|returns?|profit|win|you\s+get|gives?\s+you)\s*\$?\d[\d,\.]*'
    requires: []
    regulation_ref: art_170_part2_kz

