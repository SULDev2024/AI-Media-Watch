      regex:
        - 'earn\s+\$?\d[\d,\.]*\s*(a|per|/)\s*(day|week|month)\s+(passively|on\s+autopilot)'
        # Phase 19B FN evidence — raw "$X per day / $X daily" income claims that
        # the baseline only matched when the percent-form fired. ChatGPT-bot,
